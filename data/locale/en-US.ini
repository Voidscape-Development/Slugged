Variables.Source.Hint="Only this source can use these. Scripts and obs-websocket can set them too, either through the source's set_variable proc or by writing this same list with SetInputSettings."
Variables.Global="Shared by every Slugged source"
Variables.Global.Hint="Saved with the plugin rather than with a scene collection, so the same value is available everywhere. Scripts set these with the slugged_set_variable proc on OBS's own proc handler."
