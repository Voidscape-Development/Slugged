Variables="Variables"
Variables.Help="Write {name} anywhere in the text and it is replaced as the source renders. Variables win over the built-ins: {time}, {time12}, {seconds}, {date}, {date_long}, {weekday}, {month}, {year}, {strftime:%H:%M}, {uptime}, {timer}, {countdown:5:00}, {until:20:00}, {until:2026-12-31 20:00}, {source}, {scene}, {preview_scene}, {stream_time}, {record_time}, {fps}, {dropped_frames}, {dropped_percent}, {cpu} and {bitrate}. A token with no value stays on screen as written, so a typo is visible."
